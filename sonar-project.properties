# SonarCloud Project Configuration
# Note: Most settings are passed via CLI in the GitHub Actions workflow
# This file serves as a reference and can be used for local analysis

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests

# Language settings
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**
sonar.coverage.exclusions=**/Tests/**,**/tests/**,**/*Test.cs,**/*Tests.cs
sonar.test.exclusions=**/tests/**

# Coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# .NET specific settings
sonar.dotnet.excludeTestProjects=true

# Analysis settings
sonar.scm.provider=git
sonar.verbose=false