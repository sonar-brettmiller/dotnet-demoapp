# SonarCloud project configuration
# Note: For dotnet-sonarscanner, most configuration is embedded in the workflow
# This file is optional but can be used for additional settings

sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src/
sonar.tests=tests/

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**
sonar.coverage.exclusions=tests/**/*,**/*Test.cs,**/*Tests.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Language-specific settings
sonar.javascript.file.suffixes=.js

# Source encoding
sonar.sourceEncoding=UTF-8