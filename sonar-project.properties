# SonarCloud Project Configuration
# This file is optional when using dotnet-sonarscanner with command-line parameters
# All settings are passed via CLI in the GitHub Actions workflow

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language-specific settings
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**
sonar.test.exclusions=**/tests/**

# JavaScript files
sonar.javascript.file.suffixes=.js

# Code duplication detection
sonar.cpd.exclusions=**/Program.cs,**/Startup.cs

# Additional analysis parameters
sonar.dotnet.excludeGeneratedCode=true