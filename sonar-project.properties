# SonarCloud Project Configuration

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=cs

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**
sonar.test.exclusions=**/tests/**

# Coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Test execution reports
sonar.testExecutionReportPaths=**/TestResults/**/*.trx

# Code analysis settings
sonar.dotnet.excludeGeneratedCode=true
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# SCM settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Pull request decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/dotnet-demoapp