# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage Configuration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/build/**,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/*.cshtml,**/*.cshtml.cs
sonar.test.exclusions=**/tests/**

# JavaScript Configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Build Wrapper
sonar.cfamily.build-wrapper-output=build_wrapper_output_directory

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300