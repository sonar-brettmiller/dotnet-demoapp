# SonarCloud Project Configuration
# Organization and Project Keys
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/*.Designer.cs,**/build/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/*.cshtml,**/*.cshtml.cs
sonar.test.exclusions=**/tests/**

# Code Coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Test Results
sonar.testExecutionReportPaths=**/TestResults/**/*.trx

# .NET Specific Settings
sonar.dotnet.excludeTestProjects=true
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# JavaScript Settings
sonar.javascript.file.suffixes=.js
sonar.javascript.exclusions=**/wwwroot/lib/**,**/node_modules/**

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300