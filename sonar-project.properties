# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/node_modules/**,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Migrations/**
sonar.test.exclusions=**/tests/**

# Language-specific settings
sonar.language=cs
sonar.javascript.file.suffixes=.js

# Code Coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Build Configuration
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Pull Request Decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/dotnet-demoapp
