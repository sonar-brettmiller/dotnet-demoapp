# SonarCloud Project Configuration
# This file is optional as parameters are passed via CLI in the workflow

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language configuration
sonar.language=cs
sonar.dotnet.excludeGeneratedCode=true

# JavaScript configuration
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.test.exclusions=**/tests/**

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis settings
sonar.verbose=false