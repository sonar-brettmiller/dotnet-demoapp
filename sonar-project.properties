# SonarCloud Configuration for dotnet-demoapp
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/Program.cs

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# C# Specific Settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/*.trx

# JavaScript Configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code Coverage
sonar.coverageReportPaths=coverage/SonarQube.xml

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300