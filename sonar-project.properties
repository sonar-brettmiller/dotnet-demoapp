# SonarCloud Project Configuration
# Note: Most properties are passed via command line in the workflow
# This file serves as a reference and can override CLI parameters

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests

# Language settings
sonar.language=cs
sonar.dotnet.excludeTestProjects=true

# JavaScript settings
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/TestResults/**,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/*.cshtml,**/*.cshtml.cs
sonar.cpd.exclusions=**/wwwroot/**,**/Migrations/**

# Test and coverage settings
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Code analysis settings
sonar.sourceEncoding=UTF-8

# Pull request decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/dotnet-demoapp