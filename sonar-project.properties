# SonarCloud Configuration
# Note: For dotnet-sonarscanner, most configuration is passed via command-line parameters
# This file serves as a reference and backup configuration

# Project Identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src/
sonar.tests=tests/

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/*.min.js
sonar.coverage.exclusions=tests/**/*,**/*Test.cs,**/*Tests.cs,**/Program.cs
sonar.test.exclusions=tests/**/*

# Coverage Report Paths
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Language-Specific Settings
sonar.javascript.file.suffixes=.js
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Additional Settings
sonar.scm.provider=git
sonar.links.homepage=https://github.com/sonar-brettmiller/dotnet-demoapp
sonar.links.ci=https://github.com/sonar-brettmiller/dotnet-demoapp/actions
sonar.links.scm=https://github.com/sonar-brettmiller/dotnet-demoapp
sonar.links.issue=https://github.com/sonar-brettmiller/dotnet-demoapp/issues