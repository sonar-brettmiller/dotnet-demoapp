# SonarCloud Project Configuration
# This file is optional as parameters are passed via CLI in the workflow

# Organization and project keys
sonar.organization=sonar-brettmiller
sonar.projectKey=dotnet-demoapp
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language configuration
sonar.language=cs,js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.dll,**/*.exe
sonar.coverage.exclusions=**/tests/**,**/Tests/**,**/*Test.cs,**/*Tests.cs,**/Program.cs
sonar.test.exclusions=**/tests/**,**/Tests/**

# Code coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.trx
sonar.javascript.lcov.reportPaths=**/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git

# Additional settings
sonar.verbose=false