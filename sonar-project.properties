# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Settings
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage Reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.trx
sonar.javascript.lcov.reportPaths=**/lcov.info

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs,**/migrations/**,**/Migrations/**
sonar.coverage.exclusions=**/tests/**,**/*Test.cs,**/*Tests.cs,**/UnitTest.cs,**/Program.cs
sonar.test.exclusions=**/tests/**

# JavaScript/TypeScript Settings
sonar.javascript.node.maxspace=4096

# Duplicate Detection
sonar.cpd.exclusions=**/migrations/**,**/Migrations/**

# Analysis Settings
sonar.scm.provider=git
sonar.qualitygate.wait=true