# SonarCloud Configuration
# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=cs
sonar.dotnet.solution=dotnet-demoapp.sln

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/lib/**,**/Program.cs
sonar.test.exclusions=**/tests/**

# Duplications
sonar.cpd.exclusions=**/tests/**,**/wwwroot/lib/**

# JavaScript settings
sonar.javascript.file.suffixes=.js
sonar.javascript.node.maxspace=4096

# Analysis settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300