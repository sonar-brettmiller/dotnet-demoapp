# SonarCloud Project Configuration
# This file is optional for .NET projects as parameters are passed via CLI
# However, it can be used for additional configuration and documentation

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/wwwroot/**,**/bin/**,**/obj/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs,**/Pages/**

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# JavaScript/TypeScript (if applicable)
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.javascript.file.suffixes=.js

# Analysis parameters
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# C# specific settings
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# Build wrapper (not needed for .NET Scanner)
# The dotnet-sonarscanner automatically handles build integration
