# SonarCloud Project Configuration
# This file is optional as parameters are passed via CLI in the workflow

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Language-specific settings
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Test results
sonar.cs.vstest.reportsPaths=**/*.trx

# Duplications
sonar.cpd.exclusions=**/tests/**

# Analysis parameters
sonar.dotnet.excludeTestProjects=true