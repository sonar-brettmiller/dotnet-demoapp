# SonarCloud Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions - files and directories to exclude from analysis
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/Migrations/**

# Coverage exclusions - files to exclude from coverage calculation
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs

# Test exclusions
sonar.test.exclusions=**/tests/**

# Coverage report paths
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Language settings
sonar.sourceEncoding=UTF-8

# C# specific settings
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# JavaScript/TypeScript settings for wwwroot files
sonar.javascript.lcov.reportPaths=coverage/lcov.info