# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# C# Specific Settings
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# JavaScript Configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/TestResults/**,**/build/**,**/*.Designer.cs,**/node_modules/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/js/**,**/*.cshtml,**/*.cshtml.cs
sonar.test.exclusions=**/tests/**

# Duplicate Detection
sonar.cpd.exclusions=**/tests/**,**/Program.cs

# Analysis Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300