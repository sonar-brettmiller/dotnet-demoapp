# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests

# Language settings
sonar.language=cs
sonar.dotnet.excludeTestProjects=true

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/node_modules/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/*.js
sonar.test.exclusions=**/tests/**

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx
sonar.javascript.lcov.reportPaths=**/lcov.info

# .NET specific settings
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# SCM settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Quality gate settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300