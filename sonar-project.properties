# SonarCloud Project Configuration
# This file is optional as parameters are passed via CLI in the workflow
# but can be used for additional configuration

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code location
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=cs

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs,**/*.cshtml.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Analysis settings
sonar.dotnet.excludeTestProjects=true

# SCM
sonar.scm.provider=git

# Pull request decoration
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/dotnet-demoapp