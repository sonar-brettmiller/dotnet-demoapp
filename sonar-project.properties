# SonarCloud Project Configuration
# Organization and project keys
sonar.organization=sonar-brettmiller
sonar.projectKey=dotnet-demoapp
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# SonarCloud host
sonar.host.url=https://sonarcloud.io

# Source directories
sonar.sources=src
sonar.tests=tests

# Language-specific settings
sonar.language=cs
sonar.sourceEncoding=UTF-8

# C# specific settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.trx

# JavaScript settings
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/node_modules/**
sonar.coverage.exclusions=**/tests/**,**/Program.cs,**/Startup.cs
sonar.test.exclusions=**/tests/**

# Analysis scope
sonar.scm.provider=git

# Quality gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Code coverage
sonar.coverageReportPaths=**/coverage.opencover.xml