# SonarCloud Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Host Configuration
sonar.host.url=https://sonarcloud.io

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Source Encoding
sonar.sourceEncoding=UTF-8

# Exclusions - Files to exclude from analysis
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/*.min.js,**/*.min.css,**/node_modules/**,**/*.Designer.cs

# Coverage Exclusions - Files to exclude from coverage calculation
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/*.cshtml,**/*.cshtml.cs,**/Program.cs

# Test Inclusions - Test file patterns
sonar.test.inclusions=**/*Test.cs,**/*Tests.cs,**/UnitTest.cs

# C# Language Settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results/*.trx

# JavaScript Language Settings
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=**/lcov.info

# Code Analysis Settings
sonar.dotnet.excludeGeneratedCode=true

# SCM Settings
sonar.scm.provider=git
sonar.scm.forceReloadAll=false