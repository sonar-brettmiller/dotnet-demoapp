# SonarCloud Configuration for dotnet-demoapp
# Note: This file is optional for .NET projects using dotnet-sonarscanner
# Most configuration is passed via command-line parameters in the workflow

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests

# Language configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs

# Code coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Test execution settings
sonar.cs.vstest.reportsPaths=**/*.trx

# Analysis parameters
sonar.scm.provider=git
sonar.verbose=false

# Quality gate enforcement
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300