# SonarCloud Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/*.Designer.cs,**/TestResults/**,**/build/**
sonar.test.exclusions=**/tests/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# C# Specific Settings
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# JavaScript Configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code Analysis
sonar.dotnet.excludeGeneratedCode=true
