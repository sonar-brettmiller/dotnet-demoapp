# SonarCloud Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source Configuration
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# C# Specific Settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.xml

# JavaScript Configuration
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,build/**,**/*.Designer.cs,**/*.generated.cs
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs
sonar.test.exclusions=**/tests/**

# Additional Settings
sonar.scm.provider=git
sonar.dotnet.excludeTestProjects=true