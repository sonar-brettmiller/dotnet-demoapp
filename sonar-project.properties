# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/Migrations/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs
sonar.test.exclusions=**/tests/**

# Coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Language settings
sonar.sourceEncoding=UTF-8

# .NET specific settings
sonar.dotnet.excludeTestProjects=true

# JavaScript files in wwwroot
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info