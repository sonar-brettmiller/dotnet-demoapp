# SonarCloud Configuration for dotnet-demoapp
# Note: Most settings are configured via CLI parameters in the workflow
# This file serves as a reference and can be used for local analysis

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions for analysis
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/*.Designer.cs
sonar.test.exclusions=tests/**

# Coverage exclusions
sonar.coverage.exclusions=tests/**,**/*.cshtml.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Language settings
sonar.javascript.file.suffixes=.js

# Source encoding
sonar.sourceEncoding=UTF-8

# SCM settings
sonar.scm.provider=git

# Additional settings for ASP.NET Core
sonar.dotnet.excludeGeneratedCode=true