# SonarCloud project configuration
# Note: Scanner parameters are primarily provided via CLI in the GitHub Actions workflow
# This file serves as a reference configuration

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Language settings
sonar.language=cs
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/build/**
sonar.coverage.exclusions=tests/**,**/wwwroot/**
sonar.test.exclusions=tests/**

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.trx

# Test execution
sonar.testExecutionReportPaths=**/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Analysis settings
sonar.verbose=false