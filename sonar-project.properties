# SonarCloud Configuration for dotnet-demoapp
# Organization and Project Configuration
sonar.organization=sonar-brettmiller
sonar.projectKey=dotnet-demoapp
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# SonarCloud Host
sonar.host.url=https://sonarcloud.io

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage Configuration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Exclusions
# Exclude third-party libraries
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/build/**,**/*.Designer.cs,**/Migrations/**

# Exclude test files from coverage
sonar.coverage.exclusions=**/tests/**,**/wwwroot/lib/**,**/*.cshtml,**/*.cshtml.cs

# Test Exclusions
sonar.test.exclusions=**/tests/**

# JavaScript Configuration
sonar.javascript.file.suffixes=.js
sonar.javascript.exclusions=**/wwwroot/lib/**,**/node_modules/**

# Analysis Parameters
sonar.scm.provider=git
sonar.links.homepage=https://github.com/sonar-brettmiller/dotnet-demoapp
sonar.links.ci=https://github.com/sonar-brettmiller/dotnet-demoapp/actions
sonar.links.scm=https://github.com/sonar-brettmiller/dotnet-demoapp
sonar.links.issue=https://github.com/sonar-brettmiller/dotnet-demoapp/issues

# Code Quality Settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# .NET Specific Settings
sonar.dotnet.excludeTestProjects=true
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**