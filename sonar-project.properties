# SonarCloud Configuration for dotnet-demoapp
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Coverage Reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Test Results
sonar.cs.vstest.reportsPaths=**/junit-results.xml

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/*.Designer.cs,**/Migrations/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs,**/*.cshtml,**/*.cshtml.cs
sonar.test.exclusions=**/tests/**

# Test Project Pattern
sonar.testProjectPattern=**/tests.csproj

# Duplication Detection
sonar.cpd.exclusions=**/Migrations/**,**/*.Designer.cs

# JavaScript/TypeScript Configuration
sonar.javascript.exclusions=**/wwwroot/lib/**,**/node_modules/**

# Analysis Settings
sonar.scm.provider=git
sonar.scm.disabled=false