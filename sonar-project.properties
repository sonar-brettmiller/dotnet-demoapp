# SonarCloud Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Structure
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/TestResults/**,**/*.Designer.cs,**/Migrations/**
sonar.test.exclusions=tests/**
sonar.coverage.exclusions=**/Pages/**/*.cshtml.cs,**/Program.cs,**/Startup.cs,**/wwwroot/**/*.js,tests/**

# C# Analysis
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# JavaScript Analysis
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Code Quality Settings
sonar.qualitygate.wait=true