# SonarCloud Project Configuration
# This file is optional when using dotnet-sonarscanner
# Configuration is primarily managed through workflow parameters

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src/
sonar.tests=tests/

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/*.Designer.cs,**/Migrations/**
sonar.coverage.exclusions=tests/**/*,**/*Test.cs,**/*Tests.cs,**/Program.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Language settings
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js

# .NET specific settings
sonar.dotnet.excludeTestProjects=true

# Analysis parameters
sonar.scm.provider=git