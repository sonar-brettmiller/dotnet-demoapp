# SonarCloud Project Configuration
# Note: Most parameters are passed via CLI in GitHub Actions workflow
# This file serves as documentation and fallback configuration

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**
sonar.test.exclusions=**/obj/**,**/bin/**

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Language-specific settings
sonar.javascript.file.suffixes=.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Additional settings
sonar.verbose=false
sonar.log.level=INFO
