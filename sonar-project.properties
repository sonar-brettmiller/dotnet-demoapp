# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Source Encoding
sonar.sourceEncoding=UTF-8

# Language Configuration
sonar.language=cs
sonar.dotnet.excludeTestProjects=true

# JavaScript Configuration
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/*.Designer.cs,**/Migrations/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs
sonar.test.exclusions=**/tests/**

# Coverage Settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Duplications
sonar.cpd.exclusions=**/Migrations/**,**/*.Designer.cs

# Analysis Parameters
sonar.scm.provider=git
sonar.verbose=false