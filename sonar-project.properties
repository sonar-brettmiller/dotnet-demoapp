# SonarCloud Project Configuration
# Note: Most parameters are passed via CLI in the GitHub Actions workflow
# This file serves as a reference and can be used for local analysis

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source code settings
sonar.sources=src
sonar.tests=tests

# Language-specific settings
sonar.language=cs
sonar.dotnet.solution=dotnet-demoapp.sln

# JavaScript files
sonar.javascript.file.suffixes=.js

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs
sonar.test.exclusions=**/tests/**

# Coverage settings
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/test-results.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Code analysis
sonar.cpd.exclusions=**/tests/**

# ASP.NET Core specific
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**