# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/*.cshtml
sonar.coverage.exclusions=tests/**,**/*.cshtml,**/*.js

# Code Coverage
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Language Settings
sonar.javascript.file.suffixes=.js
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.verbose=false