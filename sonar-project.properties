# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Metadata
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source Code
sonar.sources=src
sonar.tests=tests

# Language Configuration
sonar.language=cs
sonar.sourceEncoding=UTF-8

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/*.min.js,**/*.min.css,**/build/**
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs
sonar.test.exclusions=**/tests/**
sonar.cpd.exclusions=**/wwwroot/**,**/Migrations/**

# .NET Specific Settings
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# JavaScript Settings
sonar.javascript.lcov.reportPaths=**/coverage/lcov.info
sonar.javascript.file.suffixes=.js

# Code Analysis
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=csharpsquid:S125
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.cs

# SCM
sonar.scm.provider=git
sonar.scm.forceReloadAll=false

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300