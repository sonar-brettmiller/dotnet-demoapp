# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/Migrations/**
sonar.coverage.exclusions=**/tests/**,**/Program.cs

# Coverage reports
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.javascript.lcov.reportPaths=**/lcov.info

# Language settings
sonar.language=cs,js

# Test results (optional)
sonar.testExecutionReportPaths=**/test-results/junit.xml

# .NET specific settings
sonar.dotnet.excludeTestProjects=true

# Code analysis
sonar.sourceEncoding=UTF-8