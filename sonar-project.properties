# SonarCloud Project Configuration
# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/Migrations/**,**/*.Designer.cs

# Coverage exclusions
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs,**/*.cshtml,**/*.cshtml.cs

# Code coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml

# Language-specific settings
sonar.sourceEncoding=UTF-8
sonar.cs.analyzer.projectOutPaths=**/bin/**,**/obj/**

# JavaScript settings
sonar.javascript.file.suffixes=.js
sonar.javascript.exclusions=**/wwwroot/lib/**

# Analysis settings
sonar.scm.provider=git