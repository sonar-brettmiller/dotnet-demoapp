# SonarCloud Project Configuration
# This file is optional when using dotnet-sonarscanner as configuration is embedded in the workflow
# However, it can be used for additional project-level settings

# Project identification
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test paths
sonar.sources=src/
sonar.tests=tests/

# Exclusions
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/*.dll,**/*.pdb
sonar.coverage.exclusions=tests/**/*,**/*Test.cs,**/*Tests.cs
sonar.test.exclusions=tests/**/*

# Coverage reporting
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml

# Language-specific settings
sonar.sourceEncoding=UTF-8
sonar.javascript.file.suffixes=.js

# Code analysis settings
sonar.issue.ignore.multicriteria=e1,e2

# Ignore generated files
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/obj/**

# Ignore third-party libraries
sonar.issue.ignore.multicriteria.e2.ruleKey=*
sonar.issue.ignore.multicriteria.e2.resourceKey=**/wwwroot/lib/**