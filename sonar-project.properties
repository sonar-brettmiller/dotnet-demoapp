# SonarCloud Project Configuration
# Organization and project identifiers
sonar.organization=sonar-brettmiller
sonar.projectKey=dotnet-demoapp
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# SonarCloud host
sonar.host.url=https://sonarcloud.io

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Source encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=cs
sonar.javascript.file.suffixes=.js

# Exclusions for build artifacts and third-party libraries
sonar.exclusions=**/obj/**,**/bin/**,**/wwwroot/lib/**,**/node_modules/**
sonar.coverage.exclusions=**/tests/**,**/Program.cs,**/wwwroot/**
sonar.test.exclusions=**/tests/**

# Code coverage settings for .NET
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.coverageReportPaths=**/TestResults/**/coverage.opencover.xml

# Test results
sonar.testExecutionReportPaths=**/test-results.xml

# SCM settings
sonar.scm.provider=git

# Analysis parameters
sonar.verbose=false
sonar.log.level=INFO

# Quality Gate settings (optional - can be configured in SonarCloud UI)
# sonar.qualitygate.wait=true
# sonar.qualitygate.timeout=300