# SonarCloud Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.host.url=https://sonarcloud.io

# Project Information
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and Test Directories
sonar.sources=src
sonar.tests=tests

# Exclusions
sonar.exclusions=**/wwwroot/lib/**,**/obj/**,**/bin/**,**/build/**,**/*.Designer.cs
sonar.test.exclusions=**/tests/**

# Code Coverage
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.coverageReportPaths=**/coverage.opencover.xml

# Language-specific settings
sonar.language=cs
sonar.javascript.file.suffixes=.js

# Analysis settings
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Pull Request decoration (GitHub)
sonar.pullrequest.provider=github
sonar.pullrequest.github.repository=sonar-brettmiller/dotnet-demoapp