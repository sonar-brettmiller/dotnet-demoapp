# SonarQube Project Configuration
sonar.projectKey=dotnet-demoapp
sonar.organization=sonar-brettmiller
sonar.projectName=dotnet-demoapp
sonar.projectVersion=1.0

# Source and test directories
sonar.sources=src
sonar.tests=tests

# Exclusions - files and directories to exclude from analysis
sonar.exclusions=**/wwwroot/lib/**,**/bin/**,**/obj/**,**/Migrations/**,**/build/**

# Coverage exclusions - files to exclude from coverage reporting
sonar.coverage.exclusions=**/tests/**,**/wwwroot/**,**/Program.cs,**/Error.cshtml.cs

# Test exclusions
sonar.test.exclusions=**/tests/**

# Coverage report paths
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Language settings
sonar.sourceEncoding=UTF-8

# JavaScript/TypeScript specific settings
sonar.javascript.file.suffixes=.js

# Code duplication detection
sonar.cpd.exclusions=**/tests/**

# Analysis settings
sonar.scm.provider=git