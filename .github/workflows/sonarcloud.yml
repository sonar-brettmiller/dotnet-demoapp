name: SonarCloud Analysis

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'
      
      - name: Setup .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      
      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-
      
      - name: Install SonarQube Scanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner
      
      - name: Restore dependencies for all projects
        run: |
          dotnet restore dotnet-demoapp.sln
          if [ -f tests/tests.csproj ]; then
            dotnet restore tests/tests.csproj
          fi
      
      - name: Update Test Project Target Framework
        run: |
          if [ -f tests/tests.csproj ]; then
            sed -i 's/<TargetFramework>net5.0<\/TargetFramework>/<TargetFramework>net6.0<\/TargetFramework>/g' tests/tests.csproj
            sed -i 's/<TargetFramework>net5\.0<\/TargetFramework>/<TargetFramework>net6.0<\/TargetFramework>/g' tests/tests.csproj
            echo "Updated test project target framework"
            cat tests/tests.csproj
          fi
      
      - name: Restore test project dependencies after framework update
        run: |
          if [ -f tests/tests.csproj ]; then
            dotnet restore tests/tests.csproj --force
          fi
      
      - name: Begin SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"dotnet-demoapp" \
            /o:"sonar-brettmiller" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" \
            /d:sonar.cs.vstest.reportsPaths="**/TestResults/*.trx" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/wwwroot/lib/**,**/*.Generated.cs" \
            /d:sonar.coverage.exclusions="**/tests/**,**/*.cshtml.cs,**/Program.cs"
      
      - name: Build Solution
        run: dotnet build dotnet-demoapp.sln --no-restore --configuration Release
      
      - name: Run Tests with Coverage
        run: |
          dotnet test dotnet-demoapp.sln \
            --no-build \
            --configuration Release \
            --logger trx \
            --collect:"XPlat Code Coverage" \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover
      
      - name: End SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"
      
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .sonarqube/out/.sonar/report-task.txt